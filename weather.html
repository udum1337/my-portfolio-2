<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Погодный виджет</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #e0f2fe 0%, #bae6fd 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    color: #0f172a;
    line-height: 1.5;
    position: relative;
    overflow-x: hidden;
  }

  .weather-bg-overlay {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: linear-gradient(160deg, #334155 0%, #0f172a 100%);
    opacity: 0;
    transition: opacity 1s ease;
  }
  body.weather-rain .weather-bg-overlay { opacity: 0.92; }

  #bgCanvas {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
  }

  .app {
    width: 100%; max-width: 520px; position: relative; z-index: 2;
  }

  /* ---- Поиск ---- */
  .search-box { display: flex; gap: 8px; margin-bottom: 20px; }
  .search-box input {
    flex: 1; padding: 14px 18px;
    border: 1.5px solid #7dd3fc; border-radius: 14px;
    font-family: inherit; font-size: 1rem;
    background: #fff; color: #0f172a;
    transition: border-color 0.2s, box-shadow 0.2s;
    min-width: 0;
  }
  .search-box input:focus {
    outline: none; border-color: #0ea5e9;
    box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2);
  }
  .search-box input:disabled { opacity: 0.6; }
  .search-box button {
    padding: 14px 20px;
    background: linear-gradient(135deg, #0ea5e9, #0284c7);
    color: #fff; border: none; border-radius: 14px;
    font-family: inherit; font-weight: 700; font-size: 1rem;
    cursor: pointer; flex-shrink: 0;
    transition: transform 0.15s, box-shadow 0.2s;
  }
  .search-box button:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(2, 132, 199, 0.35);
  }
  .search-box button:active:not(:disabled) { transform: scale(0.97); }
  .search-box button:disabled { opacity: 0.6; cursor: not-allowed; }

  .search-box button.geo-btn {
    padding: 14px 16px;
    background: #fff; color: #0ea5e9;
    border: 1.5px solid #7dd3fc;
    font-size: 1.2rem;
  }
  .search-box button.geo-btn:hover:not(:disabled) {
    background: #f0f9ff;
    box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
  }

  /* ---- Состояния ---- */
  .state {
    background: #fff; border-radius: 20px;
    padding: 40px 24px; text-align: center;
    box-shadow: 0 10px 30px rgba(2, 132, 199, 0.1);
  }
  .state.hidden { display: none; }
  .state-icon { font-size: 3rem; margin-bottom: 12px; }
  .state-text { color: #64748b; font-size: 0.95rem; }
  .state-text.error { color: #dc2626; }
  .state-hint { font-size: 0.78rem; color: #94a3b8; margin-top: 10px; }

  /* ---- Карточка ---- */
  .weather-card {
    position: relative; overflow: hidden;
    background: #fff; border-radius: 20px;
    box-shadow: 0 10px 30px rgba(2, 132, 199, 0.12);
    display: none;
  }
  .weather-card.visible {
    display: block;
    animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .weather-canvas {
    position: absolute; top: 0; left: 0;
    pointer-events: none; z-index: 0;
  }
  .weather-content {
    position: relative; z-index: 1;
    padding: 28px 24px;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .weather-top {
    display: flex; justify-content: space-between;
    align-items: flex-start; margin-bottom: 20px; gap: 12px;
  }
  .weather-city {
    font-size: 1.2rem; font-weight: 700;
    color: #0f172a; word-break: break-word;
  }
  .weather-country { font-size: 0.78rem; color: #64748b; margin-top: 2px; }
  .weather-time {
    font-size: 0.72rem; color: #94a3b8;
    text-align: right; white-space: nowrap;
  }

  .weather-main {
    display: flex; align-items: center;
    gap: 20px; margin-bottom: 24px;
  }
  .weather-emoji {
    font-size: 4.5rem; line-height: 1; flex-shrink: 0;
    filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.08));
  }
  .weather-temp-block { flex: 1; min-width: 0; }
  .weather-temp {
    font-size: 3rem; font-weight: 800;
    color: #0f172a; line-height: 1;
    letter-spacing: -0.03em;
  }
  .weather-desc {
    font-size: 0.95rem; color: #475569;
    margin-top: 6px; font-weight: 500;
  }

  .weather-details {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 10px; margin-bottom: 18px;
  }
  .detail {
    background: #f0f9ff; border-radius: 12px;
    padding: 12px 14px;
    display: flex; justify-content: space-between;
    align-items: center; gap: 8px;
  }
  .detail-label { font-size: 0.78rem; color: #64748b; }
  .detail-value {
    font-size: 0.95rem; font-weight: 700;
    color: #0c4a6e; white-space: nowrap;
  }

  /* ---- Прогноз на неделю ---- */
  .forecast { margin-bottom: 18px; }
  .forecast-title {
    font-size: 0.72rem; font-weight: 700;
    color: #64748b; margin-bottom: 8px;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .forecast-grid {
    display: grid; grid-auto-flow: column;
    grid-auto-columns: 62px; gap: 6px;
    overflow-x: auto; padding-bottom: 8px;
    scrollbar-width: thin;
    scrollbar-color: rgba(14, 165, 233, 0.35) transparent;
    scroll-snap-type: x proximity;
  }
  .forecast-grid::-webkit-scrollbar { height: 4px; }
  .forecast-grid::-webkit-scrollbar-thumb {
    background: rgba(14, 165, 233, 0.35); border-radius: 2px;
  }
  .forecast-item {
    background: #f0f9ff; border-radius: 12px;
    padding: 10px 4px; text-align: center;
    scroll-snap-align: start;
    transition: background 0.2s, color 0.2s;
    cursor: pointer;
    border: 1.5px solid transparent;
  }
  .forecast-item:hover { background: #dbeafe; }
  .forecast-item.selected {
    background: #0ea5e9;
    border-color: #0284c7;
  }
  .forecast-item.selected .forecast-day,
  .forecast-item.selected .forecast-temp,
  .forecast-item.selected .forecast-temp .min { color: #fff; }

  .forecast-day {
    font-size: 0.65rem; color: #64748b;
    font-weight: 600; margin-bottom: 6px;
    white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
  }
  .forecast-emoji {
    font-size: 1.6rem; line-height: 1;
    margin-bottom: 6px;
  }
  .forecast-temp {
    font-size: 0.76rem; color: #0c4a6e;
    font-weight: 700; white-space: nowrap;
  }
  .forecast-temp .min {
    color: #94a3b8; font-weight: 500; margin-left: 2px;
  }

  /* ---- Почасовой блок ---- */
  .hourly { margin-bottom: 18px; display: none; }
  .hourly.visible { display: block; }
  .hourly-title {
    font-size: 0.72rem; font-weight: 700;
    color: #64748b; margin-bottom: 8px;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .hourly-title strong { color: #0c4a6e; text-transform: none; letter-spacing: 0; }
  .hourly-grid {
    display: grid; grid-auto-flow: column;
    grid-auto-columns: 66px; gap: 6px;
    overflow-x: auto; padding-bottom: 8px;
    scrollbar-width: thin;
    scrollbar-color: rgba(14, 165, 233, 0.35) transparent;
    scroll-snap-type: x proximity;
  }
  .hourly-grid::-webkit-scrollbar { height: 4px; }
  .hourly-grid::-webkit-scrollbar-thumb {
    background: rgba(14, 165, 233, 0.35); border-radius: 2px;
  }
  .hourly-item {
    background: #f0f9ff; border-radius: 10px;
    padding: 10px 4px; text-align: center;
    scroll-snap-align: start;
    transition: background 0.2s;
    cursor: default;
  }
  .hourly-item:hover { background: #dbeafe; }
  .hourly-item.now { background: #0ea5e9; }
  .hourly-item.now .hourly-time,
  .hourly-item.now .hourly-temp,
  .hourly-item.now .hourly-precip { color: #fff; }
  .hourly-time {
    font-size: 0.68rem; color: #64748b; font-weight: 700;
  }
  .hourly-emoji {
    font-size: 1.4rem; line-height: 1;
    margin: 5px 0;
  }
  .hourly-temp {
    font-size: 0.82rem; color: #0c4a6e; font-weight: 700;
  }
  .hourly-precip {
    font-size: 0.62rem; color: #0ea5e9; font-weight: 600;
    margin-top: 3px; min-height: 0.95em;
  }
  .hourly-precip.empty { visibility: hidden; }

  .weather-attribution {
    text-align: center; font-size: 0.68rem;
    color: #94a3b8; padding-top: 14px;
    border-top: 1px dashed #e2e8f0;
  }
  .weather-attribution a {
    color: #0ea5e9; text-decoration: none;
  }
  .weather-attribution a:hover { text-decoration: underline; }

  .spinner {
    width: 32px; height: 32px;
    border: 3px solid #bae6fd;
    border-top-color: #0ea5e9;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 480px) {
    body { padding: 16px 12px; }
    .weather-content { padding: 22px 18px; }
    .weather-emoji { font-size: 3.5rem; }
    .weather-temp { font-size: 2.4rem; }
    .weather-city { font-size: 1.05rem; }
    .weather-details { grid-template-columns: 1fr; }
    .forecast-grid { grid-auto-columns: 58px; }
    .hourly-grid { grid-auto-columns: 62px; }
  }
</style>
</head>
<body>

<div class="weather-bg-overlay"></div>
<canvas id="bgCanvas"></canvas>

<div class="app">
  <form class="search-box" id="searchForm">
    <input type="text" id="cityInput"
           placeholder="Введите город, например: Москва"
           autocomplete="off" required>
    <button type="submit" id="searchBtn">Найти</button>
    <button type="button" class="geo-btn" id="geoBtn"
            title="Определить местоположение">📍</button>
  </form>

  <div class="state hidden" id="loadingState">
    <div class="spinner"></div>
    <p class="state-text">Загружаем погоду...</p>
  </div>

  <div class="state" id="messageState">
    <div class="state-icon">🌤</div>
    <p class="state-text" id="messageText">Введите город, чтобы увидеть погоду</p>
    <p class="state-hint" id="messageHint">Или нажмите 📍 для автоопределения</p>
  </div>

  <div class="weather-card" id="weatherCard">
    <canvas class="weather-canvas" id="rainCanvas"></canvas>
    <div class="weather-content">

      <div class="weather-top">
        <div>
          <div class="weather-city" id="weatherCity"></div>
          <div class="weather-country" id="weatherCountry"></div>
        </div>
        <div class="weather-time" id="weatherTime"></div>
      </div>

      <div class="weather-main">
        <div class="weather-emoji" id="weatherEmoji"></div>
        <div class="weather-temp-block">
          <div class="weather-temp" id="weatherTemp"></div>
          <div class="weather-desc" id="weatherDesc"></div>
        </div>
      </div>

      <div class="weather-details">
        <div class="detail">
          <span class="detail-label">💨 Ветер</span>
          <span class="detail-value" id="weatherWind"></span>
        </div>
        <div class="detail">
          <span class="detail-label">💧 Влажность</span>
          <span class="detail-value" id="weatherHumidity"></span>
        </div>
        <div class="detail">
          <span class="detail-label">🌡 Ощущается</span>
          <span class="detail-value" id="weatherFeels"></span>
        </div>
        <div class="detail">
          <span class="detail-label">☀️ УФ-индекс</span>
          <span class="detail-value" id="weatherUv"></span>
        </div>
      </div>

      <div class="forecast">
        <div class="forecast-title">Прогноз на неделю</div>
        <div class="forecast-grid" id="forecastGrid"></div>
      </div>

      <div class="hourly" id="hourlyBlock">
        <div class="hourly-title" id="hourlyTitle">По часам</div>
        <div class="hourly-grid" id="hourlyGrid"></div>
      </div>

      <div class="weather-attribution">
        Данные: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>
        · Геокодинг: <a href="https://nominatim.openstreetmap.org/" target="_blank" rel="noopener">Nominatim</a>
      </div>

    </div>
  </div>
</div>

<script>
var GEO_URL = 'https://geocoding-api.open-meteo.com/v1/search';
var WEATHER_URL = 'https://api.open-meteo.com/v1/forecast';
var NOMINATIM_URL = 'https://nominatim.openstreetmap.org/reverse';
var STORAGE_KEY = 'weather-last-city';

var WMO_MAP = {
  0:  { emoji: '☀️', text: 'Ясно' },
  1:  { emoji: '🌤', text: 'Преимущественно ясно' },
  2:  { emoji: '⛅', text: 'Переменная облачность' },
  3:  { emoji: '☁️', text: 'Пасмурно' },
  45: { emoji: '🌫', text: 'Туман' },
  48: { emoji: '🌫', text: 'Туман с изморозью' },
  51: { emoji: '🌦', text: 'Слабая морось' },
  53: { emoji: '🌦', text: 'Умеренная морось' },
  55: { emoji: '🌧', text: 'Сильная морось' },
  56: { emoji: '🌧', text: 'Ледяная морось' },
  57: { emoji: '🌧', text: 'Сильная ледяная морось' },
  61: { emoji: '🌧', text: 'Слабый дождь' },
  63: { emoji: '🌧', text: 'Умеренный дождь' },
  65: { emoji: '🌧', text: 'Сильный дождь' },
  66: { emoji: '🌧', text: 'Ледяной дождь' },
  67: { emoji: '🌧', text: 'Сильный ледяной дождь' },
  71: { emoji: '🌨', text: 'Слабый снег' },
  73: { emoji: '🌨', text: 'Умеренный снег' },
  75: { emoji: '❄️', text: 'Сильный снег' },
  77: { emoji: '🌨', text: 'Снежная крупа' },
  80: { emoji: '🌦', text: 'Слабый ливень' },
  81: { emoji: '🌧', text: 'Умеренный ливень' },
  82: { emoji: '⛈', text: 'Сильный ливень' },
  85: { emoji: '🌨', text: 'Слабый снегопад' },
  86: { emoji: '🌨', text: 'Сильный снегопад' },
  95: { emoji: '⛈', text: 'Гроза' },
  96: { emoji: '⛈', text: 'Гроза с градом' },
  99: { emoji: '⛈', text: 'Сильная гроза с градом' }
};

var RAIN_CODES = [51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82, 95, 96, 99];
var SNOW_CODES = [71, 73, 75, 77, 85, 86];

/* DOM */
var searchForm     = document.getElementById('searchForm');
var cityInput      = document.getElementById('cityInput');
var searchBtn      = document.getElementById('searchBtn');
var geoBtn         = document.getElementById('geoBtn');

var loadingState   = document.getElementById('loadingState');
var messageState   = document.getElementById('messageState');
var messageText    = document.getElementById('messageText');
var messageHint    = document.getElementById('messageHint');

var weatherCard    = document.getElementById('weatherCard');
var weatherCity    = document.getElementById('weatherCity');
var weatherCountry = document.getElementById('weatherCountry');
var weatherTime    = document.getElementById('weatherTime');
var weatherEmoji   = document.getElementById('weatherEmoji');
var weatherTemp    = document.getElementById('weatherTemp');
var weatherDesc    = document.getElementById('weatherDesc');
var weatherWind    = document.getElementById('weatherWind');
var weatherHumidity= document.getElementById('weatherHumidity');
var weatherFeels   = document.getElementById('weatherFeels');
var weatherUv      = document.getElementById('weatherUv');
var forecastGrid   = document.getElementById('forecastGrid');

var hourlyBlock    = document.getElementById('hourlyBlock');
var hourlyTitle    = document.getElementById('hourlyTitle');
var hourlyGrid     = document.getElementById('hourlyGrid');

var rainCanvas     = document.getElementById('rainCanvas');
var bgCanvas       = document.getElementById('bgCanvas');

/* Состояние погоды */
var hourlyData = null;
var dailyData = null;
var cityNowIso = null;      // 'YYYY-MM-DDTHH:MM' в часовом поясе города
var cityTodayStr = null;    // 'YYYY-MM-DD'
var cityNowHour = 0;
var selectedDateStr = null;

/* ---------- Утилиты ---------- */
function showState(state) {
  loadingState.classList.add('hidden');
  messageState.classList.add('hidden');
  weatherCard.classList.remove('visible');
  if (state === 'loading') {
    loadingState.classList.remove('hidden');
    stopAnimation();
  } else if (state === 'message') {
    messageState.classList.remove('hidden');
    stopAnimation();
  } else if (state === 'weather') {
    weatherCard.classList.add('visible');
  }
}

function showMessage(text, isError, hint) {
  messageText.textContent = text;
  messageText.className = 'state-text' + (isError ? ' error' : '');
  messageHint.textContent = hint || '';
  messageHint.style.display = hint ? '' : 'none';
  showState('message');
}

async function fetchJson(url, options) {
  var controller = new AbortController();
  var timer = setTimeout(function() { controller.abort(); }, 12000);
  try {
    var response = await fetch(url, Object.assign({ signal: controller.signal }, options || {}));
    clearTimeout(timer);
    if (!response.ok) throw new Error('HTTP ' + response.status);
    return await response.json();
  } catch (err) {
    clearTimeout(timer);
    if (err.name === 'AbortError') throw new Error('Превышено время ожидания');
    throw err;
  }
}

function formatTemp(t) {
  var r = Math.round(t);
  return (r > 0 ? '+' : '') + r + '°';
}

function saveLastCity(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
}
function loadLastCity() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    var data = JSON.parse(raw);
    if (data && typeof data.lat === 'number' && typeof data.lon === 'number') return data;
  } catch (e) {}
  return null;
}

/* ---------- Геолокация ---------- */
function getCoords() {
  return new Promise(function(resolve, reject) {
    if (!navigator.geolocation) return reject(new Error('Геолокация не поддерживается'));
    navigator.geolocation.getCurrentPosition(
      function(pos) { resolve(pos.coords); },
      function(err) {
        var msg = 'Не удалось определить местоположение';
        if (err.code === 1) msg = 'Доступ к геолокации запрещён';
        else if (err.code === 2) msg = 'Местоположение недоступно';
        else if (err.code === 3) msg = 'Превышено время ожидания геолокации';
        reject(new Error(msg));
      },
      { timeout: 10000, enableHighAccuracy: false, maximumAge: 600000 }
    );
  });
}

async function reverseGeocode(lat, lon) {
  try {
    var url = NOMINATIM_URL + '?lat=' + lat + '&lon=' + lon +
              '&format=json&accept-language=ru&zoom=10';
    var data = await fetchJson(url, { headers: { 'Accept': 'application/json' } });
    var addr = data.address || {};
    var name = addr.city || addr.town || addr.village ||
               addr.municipality || addr.county || data.name || 'Моё местоположение';
    return { name: name, country: addr.country || '', admin1: addr.state || addr.region || '' };
  } catch (e) {
    return { name: 'Моё местоположение', country: '', admin1: '' };
  }
}

/* ---------- Запросы ---------- */
async function searchByCity(query) {
  var q = query.trim();
  if (!q) { showMessage('Введите название города', true); return; }
  showState('loading');
  setBusy(true);
  try {
    var geoUrl = GEO_URL + '?name=' + encodeURIComponent(q) + '&count=1&language=ru&format=json';
    var geoData = await fetchJson(geoUrl);
    if (!geoData.results || geoData.results.length === 0) {
      throw new Error('Город «' + q + '» не найден.');
    }
    var place = geoData.results[0];
    await fetchWeatherByCoords(place.latitude, place.longitude, {
      name: place.name, country: place.country || '', admin1: place.admin1 || ''
    });
  } catch (err) {
    showMessage(err.message || 'Что-то пошло не так', true);
  } finally {
    setBusy(false);
  }
}

async function fetchWeatherByCoords(lat, lon, place) {
  var weatherUrl = WEATHER_URL +
    '?latitude=' + lat + '&longitude=' + lon +
    '&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,uv_index' +
    '&hourly=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation_probability,weather_code,wind_speed_10m' +
    '&daily=weather_code,temperature_2m_max,temperature_2m_min' +
    '&forecast_days=7&timezone=auto';
  var data = await fetchJson(weatherUrl);
  if (!data.current) throw new Error('Не удалось получить данные о погоде');
  renderWeather(place, data.current, data.daily, data.hourly, lat, lon);
}

function setBusy(busy) {
  searchBtn.disabled = busy;
  cityInput.disabled = busy;
  geoBtn.disabled = busy;
}

/* ---------- Рендер основного ---------- */
function renderWeather(place, current, daily, hourly, lat, lon) {
  var code = current.weather_code;
  var info = WMO_MAP[code] || { emoji: '❓', text: 'Код ' + code };

  /* Сохраняем данные для интерактива */
  hourlyData = hourly;
  dailyData = daily;
  cityNowIso = current.time || null;
  if (cityNowIso) {
    cityTodayStr = cityNowIso.split('T')[0];
    cityNowHour = parseInt(cityNowIso.split('T')[1].slice(0, 2), 10) || 0;
  } else {
    cityTodayStr = null;
    cityNowHour = 0;
  }

  weatherCity.textContent = place.name;
  weatherCountry.textContent = [place.admin1, place.country].filter(Boolean).join(', ');

  if (current.time) {
    var parts = current.time.split('T');
    if (parts[1]) weatherTime.textContent = parts[1].slice(0, 5);
  }

  weatherEmoji.textContent = info.emoji;
  weatherTemp.textContent = Math.round(current.temperature_2m) + '°C';
  weatherDesc.textContent = info.text;
  weatherWind.textContent = Math.round(current.wind_speed_10m) + ' км/ч';
  weatherHumidity.textContent = current.relative_humidity_2m + '%';
  weatherFeels.textContent = Math.round(current.apparent_temperature) + '°C';
  weatherUv.textContent = current.uv_index != null ? current.uv_index.toFixed(1) : '—';

  renderForecast();

  /* Автовыбор сегодняшнего дня */
  var firstDate = (daily && daily.time && daily.time[0]) || null;
  if (firstDate) selectDay(firstDate);

  showState('weather');
  saveLastCity({ name: place.name, country: place.country, admin1: place.admin1, lat: lat, lon: lon });

  var animType = getAnimationType(code);
  requestAnimationFrame(function() { startAnimation(animType); });
}

function renderForecast() {
  if (!dailyData || !dailyData.time || dailyData.time.length === 0) {
    forecastGrid.innerHTML = '';
    return;
  }
  var DAYS_SHORT = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
  var html = '';
  var count = Math.min(7, dailyData.time.length);

  for (var i = 0; i < count; i++) {
    var dateStr = dailyData.time[i];
    var wcode   = dailyData.weather_code[i];
    var tmax    = dailyData.temperature_2m_max[i];
    var tmin    = dailyData.temperature_2m_min[i];
    var winfo   = WMO_MAP[wcode] || { emoji: '❓' };

    var label;
    if (i === 0) label = 'Сегодня';
    else if (i === 1) label = 'Завтра';
    else {
      var dp = dateStr.split('-');
      var d = new Date(+dp[0], +dp[1] - 1, +dp[2]);
      label = DAYS_SHORT[d.getDay()];
    }

    html += '<div class="forecast-item" data-date="' + dateStr + '" title="Показать почасовой прогноз">' +
              '<div class="forecast-day">' + label + '</div>' +
              '<div class="forecast-emoji">' + winfo.emoji + '</div>' +
              '<div class="forecast-temp">' + formatTemp(tmax) +
                '<span class="min">' + formatTemp(tmin) + '</span></div>' +
            '</div>';
  }
  forecastGrid.innerHTML = html;
}

/* ---------- Выбор дня и почасовой прогноз ---------- */
function selectDay(dateStr) {
  selectedDateStr = dateStr;

  forecastGrid.querySelectorAll('.forecast-item').forEach(function(el) {
    el.classList.toggle('selected', el.dataset.date === dateStr);
  });

  renderHourly(dateStr);
}

function renderHourly(dateStr) {
  if (!hourlyData || !hourlyData.time) {
    hourlyBlock.classList.remove('visible');
    return;
  }

  var isToday = cityTodayStr === dateStr;
  var isFuture = !isToday && cityTodayStr && dateStr > cityTodayStr;
  var isPast = !isToday && cityTodayStr && dateStr < cityTodayStr;

  var items = [];
  for (var i = 0; i < hourlyData.time.length; i++) {
    var t = hourlyData.time[i];               // 'YYYY-MM-DDTHH:MM'
    var tParts = t.split('T');
    if (tParts[0] !== dateStr) continue;

    var hour = parseInt(tParts[1].slice(0, 2), 10);
    /* Для сегодня пропускаем прошедшие часы */
    if (isToday && hour < cityNowHour) continue;

    items.push({
      hour: hour,
      timeStr: tParts[1],
      temp: hourlyData.temperature_2m[i],
      feels: hourlyData.apparent_temperature[i],
      code: hourlyData.weather_code[i],
      precip: hourlyData.precipitation_probability[i],
      wind: hourlyData.wind_speed_10m[i],
      humidity: hourlyData.relative_humidity_2m[i]
    });
  }

  /* Заголовок */
  var titleLabel = 'По часам — ';
  if (isToday) titleLabel += 'Сегодня';
  else if (dailyData && dailyData.time) {
    var idx = dailyData.time.indexOf(dateStr);
    if (idx === 1) titleLabel += 'Завтра';
    else {
      var dp = dateStr.split('-');
      var d = new Date(+dp[0], +dp[1] - 1, +dp[2]);
      var MONTHS = ['января','февраля','марта','апреля','мая','июня',
                    'июля','августа','сентября','октября','ноября','декабря'];
      var DAYS_FULL = ['воскресенье','понедельник','вторник','среда','четверг',
                       'пятница','суббота'];
      titleLabel += DAYS_FULL[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
    }
  }
  hourlyTitle.innerHTML = titleLabel.replace(/(— .+)$/, '<strong>$1</strong>');

  if (items.length === 0) {
    hourlyGrid.innerHTML = '<div style="padding:12px;color:#94a3b8;font-size:0.82rem;grid-column:1/-1;">Нет данных для этого дня</div>';
    hourlyBlock.classList.add('visible');
    return;
  }

  var html = '';
  for (var j = 0; j < items.length; j++) {
    var it = items[j];
    var info = WMO_MAP[it.code] || { emoji: '❓' };
    var isNow = isToday && it.hour === cityNowHour;
    var timeLabel = isNow ? 'Сейчас' : it.timeStr;
    var precipLabel = it.precip > 0 ? '💧 ' + it.precip + '%' : '';
    var tooltip = timeLabel + ' · ' +
                  info.text + '\n' +
                  'Температура: ' + formatTemp(it.temp) +
                  ' (ощущается ' + formatTemp(it.feels) + ')\n' +
                  'Ветер: ' + Math.round(it.wind) + ' км/ч\n' +
                  'Влажность: ' + it.humidity + '%';

    html += '<div class="hourly-item' + (isNow ? ' now' : '') + '" title="' + tooltip + '">' +
              '<div class="hourly-time">' + timeLabel + '</div>' +
              '<div class="hourly-emoji">' + info.emoji + '</div>' +
              '<div class="hourly-temp">' + formatTemp(it.temp) + '</div>' +
              '<div class="hourly-precip' + (precipLabel ? '' : ' empty') + '">' +
                (precipLabel || '—') +
              '</div>' +
            '</div>';
  }

  hourlyGrid.innerHTML = html;
  hourlyBlock.classList.add('visible');

  /* Прокрутить горизонтально к «Сейчас» при первом рендере */
  if (isToday) {
    var nowEl = hourlyGrid.querySelector('.hourly-item.now');
    if (nowEl) {
      var offset = nowEl.offsetLeft - hourlyGrid.offsetLeft - 10;
      hourlyGrid.scrollTo({ left: Math.max(0, offset), behavior: 'auto' });
    }
  }
}

/* ---------- Анимации ---------- */
var rainCtx = rainCanvas.getContext('2d');
var animationId = null;
var particles = [];
var currentType = 'none';

function getAnimationType(code) {
  if (RAIN_CODES.indexOf(code) !== -1) return 'rain';
  if (SNOW_CODES.indexOf(code) !== -1) return 'snow';
  return 'none';
}

function resizeCanvas() {
  var rect = weatherCard.getBoundingClientRect();
  var dpr = window.devicePixelRatio || 1;
  rainCanvas.width = Math.max(1, Math.round(rect.width * dpr));
  rainCanvas.height = Math.max(1, Math.round(rect.height * dpr));
  rainCanvas.style.width = rect.width + 'px';
  rainCanvas.style.height = rect.height + 'px';
  rainCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function initParticles(type) {
  var rect = weatherCard.getBoundingClientRect();
  var w = rect.width, h = rect.height;
  particles = [];
  var mobile = window.innerWidth < 480 ? 0.6 : 1;

  if (type === 'rain') {
    var count = Math.floor(Math.min(120, Math.max(30, w / 4)) * mobile);
    for (var i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * w, y: Math.random() * h - h,
        len: 12 + Math.random() * 14, speed: 8 + Math.random() * 10,
        opacity: 0.25 + Math.random() * 0.45, slant: 1 + Math.random() * 1.5
      });
    }
  } else if (type === 'snow') {
    var count = Math.floor(Math.min(70, Math.max(20, w / 7)) * mobile);
    for (var i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * w, y: Math.random() * h - h,
        r: 1.5 + Math.random() * 2.5, speed: 0.5 + Math.random() * 1.2,
        sway: 0.4 + Math.random() * 1.4, swayPhase: Math.random() * Math.PI * 2,
        opacity: 0.5 + Math.random() * 0.5
      });
    }
  }
}

function frame() {
  var rect = weatherCard.getBoundingClientRect();
  var w = rect.width, h = rect.height;
  rainCtx.clearRect(0, 0, w, h);

  if (currentType === 'rain') {
    rainCtx.strokeStyle = '#3b82f6';
    rainCtx.lineWidth = 1.4; rainCtx.lineCap = 'round';
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      rainCtx.globalAlpha = p.opacity;
      rainCtx.beginPath();
      rainCtx.moveTo(p.x, p.y);
      rainCtx.lineTo(p.x + p.slant * 2, p.y + p.len);
      rainCtx.stroke();
      p.y += p.speed; p.x += p.slant * 0.4;
      if (p.y > h) { p.y = -20; p.x = Math.random() * w; }
      if (p.x > w + 20) p.x = -10;
    }
  } else if (currentType === 'snow') {
    rainCtx.fillStyle = '#ffffff';
    rainCtx.shadowColor = 'rgba(71, 85, 105, 0.55)';
    rainCtx.shadowBlur = 3;
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      rainCtx.globalAlpha = p.opacity;
      var swayX = Math.sin(p.swayPhase) * p.sway * 8;
      rainCtx.beginPath();
      rainCtx.arc(p.x + swayX, p.y, p.r, 0, Math.PI * 2);
      rainCtx.fill();
      p.y += p.speed; p.swayPhase += 0.02;
      if (p.y > h + 5) { p.y = -10; p.x = Math.random() * w; }
    }
    rainCtx.shadowBlur = 0;
  }

  rainCtx.globalAlpha = 1;
  animationId = requestAnimationFrame(frame);
}

function stopAnimation() {
  if (animationId) { cancelAnimationFrame(animationId); animationId = null; }
  particles = []; currentType = 'none';
  var rect = weatherCard.getBoundingClientRect();
  if (rect.width > 0) rainCtx.clearRect(0, 0, rect.width, rect.height);
  document.body.classList.remove('weather-rain', 'weather-snow');
  bgStop();
}

function startAnimation(type) {
  stopAnimation();
  currentType = type;
  document.body.classList.remove('weather-rain', 'weather-snow');
  if (type === 'rain') document.body.classList.add('weather-rain');
  if (type === 'snow') document.body.classList.add('weather-snow');
  if (type !== 'none') {
    resizeCanvas();
    initParticles(type);
    frame();
  }
  bgStart(type);
}

/* ---------- Фоновая анимация ---------- */
var bgCtx = bgCanvas.getContext('2d');
var bgParticles = [];
var bgAnimId = null;
var bgCurrentType = 'none';

function bgResize() {
  var dpr = window.devicePixelRatio || 1;
  bgCanvas.width = Math.round(window.innerWidth * dpr);
  bgCanvas.height = Math.round(window.innerHeight * dpr);
  bgCanvas.style.width = window.innerWidth + 'px';
  bgCanvas.style.height = window.innerHeight + 'px';
  bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function bgInitParticles(type) {
  var w = window.innerWidth, h = window.innerHeight;
  bgParticles = [];
  var mobile = w < 480 ? 0.4 : 1;

  if (type === 'rain') {
    var count = Math.floor(Math.min(400, Math.max(100, w / 4)) * mobile);
    for (var i = 0; i < count; i++) {
      bgParticles.push({
        x: Math.random() * w, y: Math.random() * h - h,
        len: 10 + Math.random() * 20, speed: 6 + Math.random() * 12,
        opacity: 0.15 + Math.random() * 0.35, slant: 1 + Math.random() * 2
      });
    }
  } else if (type === 'snow') {
    var count = Math.floor(Math.min(250, Math.max(60, w / 8)) * mobile);
    for (var i = 0; i < count; i++) {
      bgParticles.push({
        x: Math.random() * w, y: Math.random() * h - h,
        r: 1 + Math.random() * 2.5, speed: 0.4 + Math.random() * 1,
        sway: 0.5 + Math.random() * 1.5, swayPhase: Math.random() * Math.PI * 2,
        opacity: 0.4 + Math.random() * 0.55
      });
    }
  }
}

function bgFrame() {
  var w = window.innerWidth, h = window.innerHeight;
  bgCtx.clearRect(0, 0, w, h);

  if (bgCurrentType === 'rain') {
    bgCtx.strokeStyle = '#93c5fd';
    bgCtx.lineWidth = 1.2; bgCtx.lineCap = 'round';
    for (var i = 0; i < bgParticles.length; i++) {
      var p = bgParticles[i];
      bgCtx.globalAlpha = p.opacity;
      bgCtx.beginPath();
      bgCtx.moveTo(p.x, p.y);
      bgCtx.lineTo(p.x + p.slant * 2, p.y + p.len);
      bgCtx.stroke();
      p.y += p.speed; p.x += p.slant * 0.4;
      if (p.y > h) { p.y = -20; p.x = Math.random() * w; }
      if (p.x > w + 20) p.x = -10;
    }
  } else if (bgCurrentType === 'snow') {
    bgCtx.fillStyle = '#ffffff';
    bgCtx.shadowColor = 'rgba(71, 85, 105, 0.4)';
    bgCtx.shadowBlur = 2.5;
    for (var i = 0; i < bgParticles.length; i++) {
      var p = bgParticles[i];
      bgCtx.globalAlpha = p.opacity;
      var swayX = Math.sin(p.swayPhase) * p.sway * 10;
      bgCtx.beginPath();
      bgCtx.arc(p.x + swayX, p.y, p.r, 0, Math.PI * 2);
      bgCtx.fill();
      p.y += p.speed; p.swayPhase += 0.015;
      if (p.y > h + 5) { p.y = -10; p.x = Math.random() * w; }
    }
    bgCtx.shadowBlur = 0;
  }
  bgCtx.globalAlpha = 1;
  bgAnimId = requestAnimationFrame(bgFrame);
}

function bgStop() {
  if (bgAnimId) { cancelAnimationFrame(bgAnimId); bgAnimId = null; }
  bgParticles = []; bgCurrentType = 'none';
  bgCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
}

function bgStart(type) {
  bgStop();
  bgCurrentType = type;
  if (type === 'none') return;
  bgResize();
  bgInitParticles(type);
  bgFrame();
}

/* ---------- Ресайз ---------- */
window.addEventListener('resize', function() {
  if (currentType !== 'none') {
    resizeCanvas();
    initParticles(currentType);
  }
  if (bgCurrentType !== 'none') {
    bgResize();
    bgInitParticles(bgCurrentType);
  }
});

/* ---------- События ---------- */
searchForm.addEventListener('submit', function(e) {
  e.preventDefault();
  searchByCity(cityInput.value);
});

geoBtn.addEventListener('click', async function() {
  showState('loading');
  setBusy(true);
  try {
    var coords = await getCoords();
    var place = await reverseGeocode(coords.latitude, coords.longitude);
    await fetchWeatherByCoords(coords.latitude, coords.longitude, place);
  } catch (err) {
    showMessage(err.message || 'Не удалось определить местоположение', true,
                'Разрешите доступ к геолокации или введите город вручную');
  } finally {
    setBusy(false);
    cityInput.focus();
  }
});

/* Клик по дню недели → почасовой прогноз */
forecastGrid.addEventListener('click', function(e) {
  var item = e.target.closest('.forecast-item');
  if (!item || !item.dataset.date) return;
  if (item.dataset.date === selectedDateStr) return;
  selectDay(item.dataset.date);
});

/* ---------- Старт ---------- */
async function init() {
  var last = loadLastCity();
  if (last) {
    showState('loading');
    try {
      await fetchWeatherByCoords(last.lat, last.lon, {
        name: last.name || 'Город',
        country: last.country || '',
        admin1: last.admin1 || ''
      });
      cityInput.value = last.name || '';
      return;
    } catch (e) { console.warn(e); }
  }
  showMessage('Введите город, чтобы увидеть погоду', false,
              'Или нажмите 📍 для автоопределения');
  cityInput.focus();
}

init();
</script>
